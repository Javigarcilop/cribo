<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cribo · triaje de correo</title>
<meta name="description" content="Cribo ordena el correo de entrada por prioridad, extrae los datos clave y prepara una respuesta para que la revises.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F4D3A'/%3E%3Crect x='7' y='9' width='18' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='7' y='15' width='12' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='7' y='21' width='6' height='3' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F5F2;
  --side: #EEECE7;
  --pane: #FFFFFF;
  --sunk: #F3F1EC;
  --hover: #ECE9E3;
  --ink: #1B1A17;
  --ink-2: #625E56;
  --ink-3: #8F8A80;
  --line: #E2DED6;
  --line-2: #D3CEC4;
  --accent: #1F4D3A;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EDE7;
  --alta: #C2412D;
  --media: #C98A12;
  --baja: #A8A398;
  --ok: #2F7A4F;
  --warn-bg: #FBEEE9;
  --warn-ink: #9A3412;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412;
    --side: #1A1A17;
    --pane: #1E1E1B;
    --sunk: #252521;
    --hover: #2A2A26;
    --ink: #ECEAE4;
    --ink-2: #A9A59C;
    --ink-3: #7C786F;
    --line: #2E2D29;
    --line-2: #3B3A35;
    --accent: #8CC7A6;
    --accent-ink: #10231A;
    --accent-soft: #22352B;
    --alta: #EE7A66;
    --media: #E2AE45;
    --baja: #6F6B63;
    --ok: #79C79A;
    --warn-bg: #3A221A;
    --warn-ink: #F7B39C;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Estructura: barra lateral · lista · lectura ---------- */
.app { display: grid; grid-template-columns: 232px 380px minmax(0, 1fr); height: 100vh; }
.side, .inbox, .detail { min-height: 0; }

/* Barra lateral */
.side {
  background: var(--side); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 18px; padding: 18px 14px 14px;
  overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand svg { flex: none; }
.brand b { font: 600 19px/1 var(--sans); letter-spacing: -0.02em; }
.btn {
  appearance: none; cursor: pointer;
  border: 1px solid var(--line-2); background: var(--pane);
  padding: 7px 12px; border-radius: 6px; font-weight: 500; font-size: 13.5px;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.1); background: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.side .btn.primary { width: 100%; padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; }
.side .btn.primary kbd { font: 500 11px var(--mono); opacity: .7; }
.group h2 { margin: 0 0 4px; padding: 0 8px; font: 500 11px/1.6 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.nav { display: grid; gap: 1px; }
.navbtn, .linkbtn, .stat {
  appearance: none; border: 0; background: transparent; cursor: pointer; width: 100%;
  display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 6px 8px; border-radius: 6px; color: var(--ink-2); font-size: 13.5px;
}
.navbtn:hover, .linkbtn:hover { background: var(--hover); color: var(--ink); }
.navbtn[aria-pressed="true"] { background: var(--pane); color: var(--ink); font-weight: 500; box-shadow: 0 0 0 1px var(--line); }
.navbtn .count, .stat .count { margin-left: auto; font: 400 12px var(--mono); color: var(--ink-3); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--line-2); }
.dot.alta { background: var(--alta); } .dot.media { background: var(--media); } .dot.baja { background: var(--baja); }
.dot.all { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.stat { cursor: default; }
.linkbtn svg, .stat svg { flex: none; color: var(--ink-3); }
.side-foot { margin-top: auto; display: grid; gap: 10px; padding: 0 8px; font-size: 12px; color: var(--ink-3); }
.keys kbd { font: 500 11px var(--mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--ink-2); }

/* Lista */
.inbox { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--pane); }
.list-head { display: flex; align-items: baseline; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.list-head h1 { margin: 0; font: 600 17px/1.2 var(--sans); }
.list-head span { font: 400 12px var(--mono); color: var(--ink-3); }
.list-head .sort { margin-left: auto; }
.list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
.list li + li { border-top: 1px solid var(--line); }
.item {
  appearance: none; width: 100%; text-align: left; cursor: pointer;
  display: grid; grid-template-columns: 3px minmax(0, 1fr); gap: 13px;
  background: transparent; border: 0; padding: 11px 16px 12px 0;
}
.item:hover { background: var(--sunk); }
.item[aria-current="true"] { background: var(--accent-soft); }
.bar { align-self: stretch; background: transparent; }
.bar.alta { background: var(--alta); } .bar.media { background: var(--media); } .bar.baja { background: var(--baja); }
.row1 { display: flex; gap: 10px; align-items: baseline; }
.from { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat { margin-left: auto; flex: none; font: 400 11px var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.subj { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snip { color: var(--ink-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flag { display: inline-flex; gap: 6px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--ink-2); }
.flag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.flag.review { color: var(--warn-ink); }
.flag.ok { color: var(--ok); }
.flag.muted { color: var(--ink-3); }
.item.done .from, .item.done .subj { color: var(--ink-3); }
.shimmer { display: inline-block; margin-top: 6px; width: 90px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--sunk), var(--line), var(--sunk)); background-size: 200% 100%; animation: sh 1.1s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.empty-list { padding: 28px 22px; color: var(--ink-2); }
.empty-list p { margin: 0 0 14px; }
.empty-list strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.empty-list .btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* Lectura */
.detail { overflow-y: auto; background: var(--bg); }
.read { max-width: 1080px; padding: 26px 34px 40px; }
.back { display: none; }
.read-head h2 { margin: 0 0 6px; font: 600 22px/1.25 var(--sans); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.meta { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.meta .mono { font-size: 12.5px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.facts span { display: inline-flex; align-items: center; gap: 7px; }
.facts b { color: var(--ink); font-weight: 500; }
.facts .review { color: var(--warn-ink); font-weight: 500; }
.alert { margin-top: 16px; padding: 12px 14px; border-left: 3px solid var(--warn-ink); background: var(--warn-bg); color: var(--warn-ink); }
.alert b { display: block; margin-bottom: 2px; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; margin-top: 22px; align-items: start; }
.mail { background: var(--pane); border: 1px solid var(--line); border-radius: 8px; }
.mail .orig { white-space: pre-wrap; margin: 0; padding: 18px 20px; font: 400 14.5px/1.65 var(--sans); overflow-wrap: anywhere; }
.reply { border-top: 1px solid var(--line); }
.reply-bar { display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: var(--sunk); border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); }
.reply-bar b { color: var(--ink); font-weight: 600; font-size: 13px; }
.reply-bar .mono { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }
.field { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; border-bottom: 1px solid var(--line); padding: 0 20px; }
.field label { font-size: 13px; color: var(--ink-3); }
.field input { border: 0; background: transparent; padding: 9px 0; outline-offset: -2px; min-width: 0; }
.field input[readonly] { color: var(--ink-2); }
.reply textarea { display: block; width: 100%; min-height: 230px; border: 0; background: transparent; padding: 14px 20px; resize: vertical; line-height: 1.6; outline-offset: -2px; }
.reply textarea:disabled, .field input:disabled { color: var(--ink-2); }
.reply-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--line); }
.holes { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }
.holes.pending { color: var(--warn-ink); }
.done-box { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--ink-2); }
.done-box.ok { color: var(--ok); }
.pre-analyze { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 13px; }

.card { font-size: 13.5px; }
.card section { padding: 0 0 16px; }
.card section + section { padding-top: 16px; border-top: 1px solid var(--line); }
.card h3 { margin: 0 0 6px; font: 500 11px/1.6 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.card p { margin: 0; }
.why { color: var(--ink-2); margin-top: 6px !important; }
dl.data { display: grid; grid-template-columns: max-content 1fr; gap: 5px 14px; margin: 0; }
dl.data dt { color: var(--ink-3); }
dl.data dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
ul.todo { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
ul.todo li { display: grid; grid-template-columns: 14px 1fr; gap: 8px; }
ul.todo li::before { content: ""; width: 12px; height: 12px; margin-top: 4px; border: 1.5px solid var(--line-2); border-radius: 3px; }

.placeholder { padding: 64px 34px; max-width: 460px; color: var(--ink-2); }
.placeholder strong { display: block; color: var(--ink); font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.placeholder p { margin: 0 0 8px; }

/* Diálogo y aviso */
dialog { border: 1px solid var(--line-2); border-radius: 10px; background: var(--pane); color: var(--ink); width: min(560px, calc(100vw - 32px)); padding: 0; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
dialog::backdrop { background: rgba(20, 18, 14, .4); }
dialog h3 { margin: 0; padding: 16px 20px; font: 600 15px var(--sans); border-bottom: 1px solid var(--line); }
dialog .field textarea { grid-column: 1 / -1; }
dialog .body { display: block; width: 100%; min-height: 180px; border: 0; background: transparent; padding: 14px 20px; resize: vertical; line-height: 1.6; outline-offset: -2px; }
dialog .reply-foot { justify-content: flex-end; }
#toast {
  position: fixed; left: 24px; bottom: 24px; transform: translateY(12px);
  background: var(--ink); color: var(--pane);
  padding: 10px 14px; border-radius: 6px; font-size: 13.5px; max-width: min(460px, calc(100vw - 48px));
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 10;
}
#toast.show { opacity: 1; transform: none; }

/* ---------- Responsive ---------- */
@media (max-width: 1280px) {
  .grid { grid-template-columns: 1fr; }
  .card { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 28px; }
  .card section + section { border-top: 0; padding-top: 0; }
  .card section { padding-bottom: 16px; }
}
@media (max-width: 1100px) {
  .app { grid-template-columns: 200px 320px minmax(0, 1fr); }
  .read { padding: 22px 22px 32px; }
}
@media (max-width: 900px) {
  .app { display: block; height: auto; }
  .side { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 14px; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; overflow: visible; }
  .side .btn.primary { width: auto; margin-left: auto; }
  .side .btn.primary kbd { display: none; }
  .group { width: 100%; }
  .group h2, .side-foot .keys, .group.out { display: none; }
  .nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .navbtn { width: auto; flex: none; }
  .tools-row { display: flex; gap: 4px; }
  .tools-row .linkbtn { width: auto; }
  .side-foot { margin: 0; padding: 0 8px; width: 100%; }
  .inbox { border-right: 0; }
  .list { max-height: 60vh; }
  .detail { border-top: 1px solid var(--line); }
  .read { padding: 18px 14px 32px; }
  .back { display: inline-flex; margin-bottom: 12px; }
  .placeholder { padding: 32px 14px; }
  .field { padding: 0 14px; }
  .reply textarea, .mail .orig { padding: 14px; }
  .reply-bar, .reply-foot { padding-left: 14px; padding-right: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navegación">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><rect x="7" y="9" width="18" height="3" rx="1.5" fill="var(--accent-ink)"/><rect x="7" y="15" width="12" height="3" rx="1.5" fill="var(--accent-ink)"/><rect x="7" y="21" width="6" height="3" rx="1.5" fill="var(--accent-ink)"/></svg>
      <b>Cribo</b>
    </div>

    <button class="btn primary" id="analyze" disabled>Analizar</button>

    <div class="group">
      <h2>Entrada</h2>
      <div class="nav" id="filters" role="group" aria-label="Filtrar por prioridad"></div>
    </div>

    <div class="group out">
      <h2>Salida</h2>
      <div class="stat" title="Respuestas aprobadas">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 8.5 6 12.5 14 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Aprobados <span class="count" id="outbox">0</span>
      </div>
    </div>

    <div class="group">
      <h2>Correo</h2>
      <div class="tools-row">
        <button class="linkbtn" id="add" type="button">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Pegar un correo</button>
      </div>
    </div>

    <div class="side-foot">
      <div class="keys"><kbd>j</kbd> <kbd>k</kbd> para moverte</div>
    </div>
  </aside>

  <section class="inbox" aria-labelledby="list-title">
    <div class="list-head">
      <h1 id="list-title">Entrada</h1>
      <span id="list-count"></span>
      <span class="sort" id="list-sort"></span>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <section class="detail" id="detail" aria-live="polite"></section>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <h3>Pegar un correo</h3>
    <div class="field"><label for="f-from">De</label><input id="f-from" required maxlength="200" placeholder="Nombre &lt;correo@empresa.com&gt;"></div>
    <div class="field"><label for="f-subj">Asunto</label><input id="f-subj" maxlength="300"></div>
    <label class="sr" for="f-body">Mensaje</label>
    <textarea class="body" id="f-body" required maxlength="6000" placeholder="Pega aquí el texto del correo"></textarea>
    <div class="reply-foot">
      <button type="button" class="btn" id="dlg-cancel">Cancelar</button>
      <button type="submit" class="btn primary">Añadir a la entrada</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status"></div>

<script>
(() => {
  const RANK = { alta: 0, media: 1, baja: 2 };
  const CAT = { presupuesto: "Presupuesto", incidencia: "Incidencia", factura: "Factura", comercial: "Comercial", otro: "Otro" };
  const PRIO = { alta: "Alta", media: "Media", baja: "Baja" };
  const DATA_LABELS = {
    nombre_contacto: "Contacto", empresa: "Empresa", importe: "Importe",
    fecha_limite: "Fecha", referencia: "Referencia", producto_o_servicio: "Producto",
  };

  const state = { emails: [], selected: null, filter: "todas", approved: 0, busy: false };
  const $ = (id) => document.getElementById(id);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const narrow = () => matchMedia("(max-width: 900px)").matches;

  // Los emails son texto no fiable: se construye el DOM con textContent, nunca con innerHTML.
  function h(tag, attrs = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(kid));
    }
    return el;
  }

  const senderName = (r) => (r.match(/^\s*"?([^"<]+?)"?\s*</) || [, r])[1].trim();
  const senderAddr = (r) => (r.match(/<([^>]+)>/) || [, r.trim()])[1];
  const snippet = (s) => (s || "").replace(/\s+/g, " ").trim().slice(0, 120);

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 3800);
  }

  async function api(path, opts) {
    const res = await fetch(path, opts);
    if (!res.ok) {
      let detail = "Algo ha fallado. Inténtalo de nuevo.";
      try { detail = (await res.json()).detail || detail; } catch {}
      throw new Error(typeof detail === "string" ? detail : "Los datos enviados no son válidos.");
    }
    return res.json();
  }

  // ---------- Lista ----------
  const visible = () => state.emails.filter((e) => {
    if (state.filter === "todas") return true;
    return e.result?.triage?.prioridad === state.filter;
  });

  function positions() {
    const map = new Map();
    document.querySelectorAll("#list li[data-id]").forEach((li) => map.set(li.dataset.id, li.getBoundingClientRect().top));
    return map;
  }

  function renderFilters() {
    const counts = { todas: state.emails.length, alta: 0, media: 0, baja: 0 };
    state.emails.forEach((e) => { const p = e.result?.triage?.prioridad; if (p) counts[p]++; });
    $("filters").replaceChildren(
      ...["todas", "alta", "media", "baja"].map((f) =>
        h("button", {
          class: "navbtn", type: "button", "aria-pressed": String(state.filter === f),
          onclick: () => { state.filter = f; renderFilters(); renderList(); },
        },
          h("span", { class: "dot " + (f === "todas" ? "all" : f) }),
          f === "todas" ? "Todo" : "Prioridad " + PRIO[f].toLowerCase(),
          h("span", { class: "count", text: String(counts[f]) }))
      )
    );
  }

  function renderList(animate = false) {
    const first = animate && !reduced ? positions() : null;
    const ul = $("list");
    const items = visible();
    const triaged = state.emails.some((e) => e.result?.triage);
    $("list-title").textContent = state.filter === "todas" ? "Entrada" : "Prioridad " + PRIO[state.filter].toLowerCase();
    $("list-count").textContent = state.emails.length ? String(items.length) : "";
    $("list-sort").textContent = state.emails.length ? (triaged ? "por prioridad" : "por llegada") : "";
    if (state.loadingInbox) {
      ul.replaceChildren(h("li", {}, h("div", { class: "empty-list" }, "Cargando la bandeja…")));
    } else if (!state.emails.length) {
      ul.replaceChildren(h("li", {}, h("div", { class: "empty-list" },
        h("p", {}, h("strong", { text: "Tu bandeja está vacía" }), "Pega un correo y Cribo lo clasificará, sacará los datos importantes y te preparará una respuesta."),
        h("div", { class: "btns" },
          h("button", { class: "btn primary", type: "button", onclick: () => $("dlg").showModal(), text: "Pegar un correo" })))));
    } else if (!items.length) {
      ul.replaceChildren(h("li", {}, h("div", { class: "empty-list" }, "Nada con esta prioridad.")));
    } else {
      ul.replaceChildren(...items.map(rowFor));
    }
    if (first) {
      ul.querySelectorAll("li[data-id]").forEach((li) => {
        const before = first.get(li.dataset.id);
        if (before === undefined) return;
        const dy = before - li.getBoundingClientRect().top;
        if (Math.abs(dy) > 1) li.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 650, easing: "cubic-bezier(.2,.8,.2,1)" });
      });
    }
    const pending = state.emails.filter((e) => !e.result?.triage).length;
    const btn = $("analyze");
    btn.disabled = state.busy || !pending;
    btn.replaceChildren(h("span", { text: state.busy ? "Analizando…" : pending ? `Analizar ${pending} ${pending === 1 ? "correo" : "correos"}` : state.emails.length ? "Todo analizado" : "Analizar" }));
    if (!state.busy && pending) btn.append(h("kbd", { title: "Intro", text: "↵" }));
  }

  function rowFor(e) {
    const t = e.result?.triage;
    let flag = null;
    if (e.loading) flag = h("span", { class: "shimmer", "aria-label": "Analizando" });
    else if (e.status === "aprobado") flag = h("span", { class: "flag ok", text: "Respuesta aprobada" });
    else if (e.status === "descartado") flag = h("span", { class: "flag muted", text: "Descartado" });
    else if (t?.alerta_seguridad) flag = h("span", { class: "flag review", text: "Posible manipulación" });
    else if (t?.requiere_revision) flag = h("span", { class: "flag review", text: "Revisar antes de responder" });
    else if (e.result?.error) flag = h("span", { class: "flag review", text: "No se pudo analizar" });

    return h("li", { "data-id": e.id },
      h("button", {
        class: "item" + (e.status ? " done" : ""), type: "button",
        "aria-current": String(state.selected === e.id),
        onclick: () => select(e.id),
      },
        h("span", { class: "bar " + (t?.prioridad || "") }),
        h("span", {},
          h("div", { class: "row1" },
            h("span", { class: "from", text: senderName(e.remitente) }),
            t && h("span", { class: "cat", text: CAT[t.categoria] })),
          h("div", { class: "subj", text: e.asunto || "(sin asunto)" }),
          h("div", { class: "snip", text: snippet(e.cuerpo) }),
          flag)));
  }

  // ---------- Detalle ----------
  function select(id, opts = {}) {
    state.selected = id;
    renderList();
    renderDetail();
    const li = document.querySelector(`#list li[data-id="${CSS.escape(id)}"]`);
    if (li && opts.keyboard) li.scrollIntoView({ block: "nearest" });
    if (narrow() && !opts.keyboard) $("detail").scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
  }

  function renderDetail() {
    const box = $("detail");
    const e = state.emails.find((x) => x.id === state.selected);
    if (!e) {
      box.replaceChildren(h("div", { class: "placeholder" },
        h("strong", { text: state.emails.length ? "Abre un correo de la lista" : "Aquí verás cada correo" }),
        h("p", { text: "Junto al mensaje tendrás un resumen, los datos importantes (importes, fechas, referencias) y una respuesta preparada que puedes editar." }),
        h("p", { text: "Nada sale sin que lo apruebes." })));
      return;
    }
    const t = e.result?.triage;
    const back = h("button", { class: "btn back", type: "button", text: "← Volver a la lista", onclick: () => $("list").scrollIntoView({ behavior: reduced ? "auto" : "smooth" }) });
    const head = h("header", { class: "read-head" },
      back,
      h("h2", { text: e.asunto || "(sin asunto)" }),
      senderName(e.remitente) === senderAddr(e.remitente)
        ? h("p", { class: "meta" }, h("span", { class: "mono", text: senderAddr(e.remitente) }))
        : h("p", { class: "meta" }, senderName(e.remitente), " ", h("span", { class: "mono", text: "<" + senderAddr(e.remitente) + ">" })),
      t && h("div", { class: "facts" },
        h("span", {}, h("span", { class: "dot " + t.prioridad }), "Prioridad ", h("b", { text: PRIO[t.prioridad].toLowerCase() })),
        h("span", {}, "Tipo ", h("b", { text: CAT[t.categoria].toLowerCase() })),
        h("span", {}, "Confianza ", h("b", { class: "mono", text: Math.round(t.confianza * 100) + " %" })),
        t.requiere_revision && h("span", { class: "review", text: "Conviene revisarlo con calma" })),
      t?.alerta_seguridad && h("div", { class: "alert", role: "alert" },
        h("b", { text: "Este correo intenta dar órdenes al asistente" }), t.alerta_seguridad));

    const orig = h("pre", { class: "orig", text: e.cuerpo });

    if (!t) {
      box.replaceChildren(h("div", { class: "read" }, head,
        h("div", { class: "grid", style: "grid-template-columns:1fr" },
          h("article", { class: "mail" }, orig,
            h("div", { class: "pre-analyze" },
              h("button", { class: "btn primary", type: "button", disabled: state.busy, onclick: () => analyze([e.id]), text: "Analizar este correo" }),
              e.result?.error ? h("span", { text: e.result.error }) : h("span", { text: "Se clasifica, se prioriza y se prepara una respuesta." }))))));
      return;
    }

    const datos = Object.entries(t.datos || {}).filter(([, v]) => v);
    const card = h("aside", { class: "card", "aria-label": "Ficha del correo" },
      h("section", {}, h("h3", { text: "En pocas palabras" }), h("p", { text: t.resumen }),
        h("p", { class: "why", text: t.motivo_prioridad })),
      h("section", {}, h("h3", { text: "Datos" }),
        datos.length ? h("dl", { class: "data" }, datos.map(([k, v]) => [h("dt", { text: DATA_LABELS[k] || k }), h("dd", { text: v })]))
                     : h("p", { class: "why", text: "Sin importes, fechas ni referencias." })),
      h("section", {}, h("h3", { text: "Pasos" }),
        t.acciones_sugeridas.length ? h("ul", { class: "todo" }, t.acciones_sugeridas.map((a) => h("li", { text: a }))) : h("p", { class: "why", text: "Nada que hacer." })));

    box.replaceChildren(h("div", { class: "read" }, head,
      h("div", { class: "grid" }, h("article", { class: "mail" }, orig, replyBox(e, t)), card)));
  }

  function replyBox(e, t) {
    const to = senderAddr(e.remitente);
    const subject = h("input", { id: "d-subj", value: t.borrador.asunto, maxlength: "300", disabled: !!e.status });
    const body = h("textarea", { id: "d-body", disabled: !!e.status, "aria-label": "Texto de la respuesta" });
    body.value = t.borrador.cuerpo;
    const holes = h("span", { class: "holes" });
    const countHoles = () => {
      const n = (body.value.match(/\[[^\]\n]+\]/g) || []).length;
      holes.className = "holes" + (n ? " pending" : "");
      holes.textContent = n ? `${n} ${n === 1 ? "hueco" : "huecos"} entre corchetes por completar` : "Sin huecos pendientes";
    };
    body.addEventListener("input", countHoles);
    countHoles();

    const approve = async () => {
      try {
        const r = await api("/api/outbox", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email_id: e.id, destinatario: to, asunto: subject.value, cuerpo: body.value }),
        });
        e.status = "aprobado";
        state.approved = r.aprobados;
        $("outbox").textContent = String(r.aprobados);
        toast("Respuesta aprobada y movida a la bandeja de salida.");
        renderList(); renderDetail();
      } catch (err) { toast(err.message); }
    };
    const discard = () => { e.status = "descartado"; renderList(); renderDetail(); };

    return h("div", { class: "reply" },
      h("div", { class: "reply-bar" }, h("b", { text: "Respuesta preparada" }), "revísala y edítala antes de aprobar"),
      h("div", { class: "field" }, h("label", { for: "d-to", text: "Para" }), h("input", { id: "d-to", value: to, readonly: true })),
      h("div", { class: "field" }, h("label", { for: "d-subj", text: "Asunto" }), subject),
      body,
      h("div", { class: "reply-foot" },
        e.status
          ? h("span", { class: "done-box" + (e.status === "aprobado" ? " ok" : ""), text: e.status === "aprobado" ? "Aprobada. Está en la bandeja de salida." : "Descartada. No se responderá." })
          : [h("button", { class: "btn primary", type: "button", onclick: approve, text: "Aprobar respuesta" }),
             h("button", { class: "btn", type: "button", onclick: discard, text: "Descartar" }),
             holes]));
  }

  // ---------- Acciones ----------
  async function analyze(onlyIds) {
    const targets = state.emails.filter((e) => (onlyIds ? onlyIds.includes(e.id) : !e.result?.triage));
    if (!targets.length || state.busy) return;
    state.busy = true;
    targets.forEach((e) => { e.loading = true; });
    renderList(); renderDetail();
    try {
      const results = await api("/api/triage", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ emails: targets.map((e) => ({ id: e.id, remitente: e.remitente, asunto: e.asunto, cuerpo: e.cuerpo })) }),
      });
      results.forEach((r) => { const e = state.emails.find((x) => x.id === r.id); if (e) e.result = r; });
      state.emails.forEach((e, i) => { e._i = i; });
      state.emails.sort((a, b) => rank(a) - rank(b) || a._i - b._i);
      targets.forEach((e) => { e.loading = false; });
      state.busy = false;
      renderFilters(); renderList(true);
      const top = state.emails.find((e) => e.result?.triage);
      if (top && !onlyIds) { state.selected = top.id; renderList(); }
      renderDetail();
    } catch (err) {
      targets.forEach((e) => { e.loading = false; });
      state.busy = false;
      renderFilters(); renderList(); renderDetail();
      toast(err.message);
    }
  }
  const rank = (e) => (e.result?.triage ? RANK[e.result.triage.prioridad] : 3);

  // Con ?demo en la URL (enlace del portfolio) la bandeja llega con correos de prueba.
  // Sin él, la app arranca vacía, como en uso real.
  const DEMO = new URLSearchParams(location.search).has("demo");

  async function loadInbox() {
    state.loadingInbox = true;
    renderList();
    try {
      const inbox = await api("/api/samples");
      const known = new Set(state.emails.map((e) => e.id));
      inbox.filter((s) => !known.has(s.id)).forEach((s) => state.emails.push({ ...s }));
    } catch (err) { toast("No se pudo cargar la bandeja. Recarga la página."); }
    state.loadingInbox = false;
    renderFilters(); renderList(); renderDetail();
  }

  function init() {
    renderFilters(); renderList(); renderDetail();
    if (DEMO) loadInbox();
  }

  // Teclado: j/k para moverse por la lista, Enter para analizar lo pendiente.
  document.addEventListener("keydown", (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey || $("dlg").open) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    const items = visible();
    if ((ev.key === "j" || ev.key === "k") && items.length) {
      const i = items.findIndex((e) => e.id === state.selected);
      const next = ev.key === "j" ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1);
      select(items[i < 0 ? 0 : next].id, { keyboard: true });
      ev.preventDefault();
    } else if (ev.key === "Enter" && ev.target === document.body && !$("analyze").disabled) {
      analyze(null);
    }
  });

  $("analyze").onclick = () => analyze(null);
  $("add").onclick = () => $("dlg").showModal();
  $("dlg-cancel").onclick = () => $("dlg").close();
  $("dlg-form").addEventListener("submit", () => {
    const e = { id: "u" + Date.now(), remitente: $("f-from").value.trim(), asunto: $("f-subj").value.trim(), cuerpo: $("f-body").value.trim() };
    if (!e.remitente || !e.cuerpo) return;
    state.emails.unshift(e);
    state.selected = e.id;
    $("dlg-form").reset();
    renderFilters(); renderList(); renderDetail();
  });

  init();
})();
</script>
</body>
</html>
